<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tareaaaaaaaaa</title>
</head>
<script>    
    const doAsyncStuffWithCallback = (numero1, numero2, callback) => {
        const resultado = numero1 + numero2;
        return setTimeout(() => {
            callback(resultado);
    }, 500);
    }

const doAsyncStuffWithPromise = (numero1, numero2) => {
    const resultado = numero1 + numero2;
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            resolve(resultado);
        }, 500);
    });
}

doAsyncStuffWithCallback(1, 3, (result) => {
    console.log(result)
});

doAsyncStuffWithPromise(1, 3)
    .then(result => console.log(result))

const result = await doAsyncStuffWithPromise(1, 3); 


</script>
